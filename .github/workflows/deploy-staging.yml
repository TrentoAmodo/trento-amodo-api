name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  PROJECT_PATH: src/TrentoAmodo.Api
  ARTIFACT_NAME: release.tar.gz
  DEPLOY_USER: tam-deploy
  DEPLOY_BASE_PATH: /var/www/trento-amodo-api
  SERVICE_NAME: trento-amodo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Human-readable and monotonically increasing: date + run number.
      - name: Compute release version
        id: version
        run: echo "value=$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore -r linux-x64

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release
          --no-self-contained
          -p:UseAppHost=false
          -o publish

      - name: Create release archive
        run: tar -czf "${{ env.ARTIFACT_NAME }}" -C publish .

      # Self-contained: applies migrations on the server without needing the
      # .NET SDK there (only the ASP.NET Core runtime is installed, see
      # deploy/SERVER_SETUP.md). Safe to run on every deploy, migration or
      # not — it's a no-op against an already-up-to-date database.
      - name: Build migrations bundle
        run: >
          dotnet tool run dotnet-ef migrations bundle
          --project src/TrentoAmodo.Infrastructure
          --startup-project src/TrentoAmodo.Api
          --output efbundle
          --self-contained
          --runtime linux-x64
          --force

      - name: Upload archive and migrations bundle to staging server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.T55_STAGING_DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.T55_STAGING_DEPLOY_KEY }}
          source: "${{ env.ARTIFACT_NAME }},efbundle"
          target: /tmp

      - name: Release on staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.T55_STAGING_DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.T55_STAGING_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            VERSION="${{ steps.version.outputs.value }}"
            BASE_PATH="${{ env.DEPLOY_BASE_PATH }}"
            RELEASE_DIR="$BASE_PATH/releases/$VERSION"

            CONNECTION_STRING="$(grep '^ConnectionStrings__Default=' /etc/trento-amodo-api/environment | cut -d= -f2-)"
            chmod +x /tmp/efbundle
            /tmp/efbundle --connection "$CONNECTION_STRING"
            rm -f /tmp/efbundle

            mkdir -p "$RELEASE_DIR"
            tar -xzf "/tmp/${{ env.ARTIFACT_NAME }}" -C "$RELEASE_DIR"
            rm -f "/tmp/${{ env.ARTIFACT_NAME }}"

            ln -sfn "$RELEASE_DIR" "$BASE_PATH/current"
            sudo /usr/bin/systemctl restart "${{ env.SERVICE_NAME }}"

            cd "$BASE_PATH/releases"
            ls -1dt */ | tail -n +6 | xargs -r rm -rf

            echo "Deployed version $VERSION"
